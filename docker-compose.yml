services:
  fossor:
    build: .
    ports:
      - "${FOSSOR_PORT:-8008}:8008"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/fossor.db
      - FOSSOR_ADMIN_PASSWORD=${FOSSOR_ADMIN_PASSWORD}
      - FOSSOR_MASTER_KEY=${FOSSOR_MASTER_KEY}
    restart: unless-stopped
