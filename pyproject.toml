[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fossor"
version = "2026.11.001"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7",
    "cryptography>=44",
    "asyncssh>=2.15",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks browser tests run with Playwright (deselect with '-m \"not e2e\"')",
    "network: optional real network call (GitHub API), deselect with '-m \"not network\"'",
]
