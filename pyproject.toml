[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fossor"
version = "2026.11.001"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7",
    "cryptography>=44",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
