<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fossor — Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#12161c;--card:#1a2029;--border:#2c3544;--txt:#e6edf3;--muted:#8b98a9;--accent:#4f8cff;--red:#f2555a}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;width:360px}
.login-box h1{text-align:center;font-size:22px;margin-bottom:6px}
.login-box .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
.field input:focus{border-color:var(--accent);outline:none}
.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}
.err{color:var(--red);font-size:12px;margin-top:12px;text-align:center;display:none}
</style>
</head>
<body>
<div class="login-box">
  <h1>⛏️ Fossor</h1>
  <p class="sub">Connexion administrateur</p>
  <form id="loginForm">
    <div class="field"><label>Nom d'utilisateur</label><input id="username" name="username" value="admin" required></div>
    <div class="field"><label>Mot de passe</label><input id="password" name="password" type="password" required></div>
    <button class="btn" type="submit">Se connecter</button>
    <div class="err" id="errBox">Identifiants invalides</div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:14px 0 4px;color:var(--muted)">
    <input type="checkbox" name="remember" value="1"> Rester connecté 30 jours
  </label>
</form>
</div>
<script>
// Minimal selector helper — this page loads no external script.
const $ = (sel) => document.querySelector(sel);

$('#loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('#errBox').style.display = 'none';
  const form = event.currentTarget;           // the <form>, not window
  const body = new URLSearchParams(new FormData(form));
  try {
    const resp = await fetch('/api/login', { method: 'POST', body });
    if (resp.ok) {
      window.location.href = '/dashboard';
      return;
    }
  } catch (err) {
    // network error → fall through to the error box
  }
  $('#errBox').style.display = 'block';
});
</script>
</body>
</html>
