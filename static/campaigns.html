<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fossor — Campagnes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#12161c;--card:#1a2029;--border:#2c3544;--txt:#e6edf3;--muted:#8b98a9;--accent:#4f8cff;--green:#3fb950;--red:#f85149;--yellow:#d29922}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
header h1{font-size:26px}
header .sub{color:var(--muted);font-size:13px;margin-left:8px}
.nav-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.nav-tabs a{color:var(--muted);padding:8px 16px;font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0}
.nav-tabs a:hover{color:var(--txt)}
.nav-tabs a.active{background:var(--card);border-color:var(--border);color:var(--txt)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px}
label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:4px}
input,select{background:#0f1319;border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:7px 9px;font-size:13px;font-family:inherit;width:100%}
.row{display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr;gap:12px;margin-bottom:12px}
.btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.machine{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.machine .name{font-size:13px;font-weight:700;margin-bottom:6px}
.machine .dev{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;color:var(--txt)}
.machine .dev.off{color:var(--muted)}
.machine .dev input{width:auto}
.machine .why{color:var(--yellow);font-size:10.5px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px;border-bottom:1px solid var(--border)}
td{padding:7px 6px;border-bottom:1px solid #232b37;vertical-align:top}
tr:last-child td{border-bottom:none}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
.chip.proposed{background:#24292f;color:var(--muted);border:1px solid var(--border)}
.chip.approved{background:#1a2a3a;color:var(--accent);border:1px solid var(--accent)}
.chip.running{background:#1a3a2a;color:var(--green);border:1px solid var(--green)}
.chip.stopping{background:#3a2f1a;color:var(--yellow);border:1px solid var(--yellow)}
.chip.done{background:#1a3a2a;color:var(--green);border:1px solid #2a5a3a}
.chip.failed{background:#3a1a1a;color:var(--red);border:1px solid var(--red)}
.chip.cancelled{background:#24292f;color:var(--muted);border:1px solid var(--border)}
.sim{display:inline-block;font-size:10px;font-weight:700;color:var(--yellow);border:1px solid var(--yellow);border-radius:999px;padding:1px 8px;margin-left:6px}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:10.5px}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.journal{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;display:none}
.journal.open{display:block}
.journal ol{list-style:none;font-size:12px}
.journal li{padding:5px 0;border-bottom:1px solid #202733}
.journal .kind{font-weight:700}
.journal .ts{color:var(--muted);font-size:10.5px;margin-right:8px}
.journal .detail{margin-top:3px;color:var(--muted);font-size:10.5px;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:13px;padding:22px;text-align:center;border:1px dashed var(--border);border-radius:12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;z-index:200;display:none;max-width:520px}
.foot{color:var(--muted);font-size:11px;margin-top:16px;text-align:right}
</style>
  <script src="/static/nav.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🎯 Campagnes</h1><span class="sub">Pilotage : token par défaut, profil de campagne, retour vérifié</span></div>
  </header>
  <nav id="nav"></nav>

  <section class="card">
    <h2>Nouvelle campagne</h2>
    <div class="row">
      <div><label for="fProfile">Profil de minage</label><select id="fProfile"></select></div>
      <div><label for="fCoin">Coin</label><input id="fCoin" placeholder="PRL" maxlength="20"></div>
      <div><label for="fStart">Début</label><input id="fStart" type="datetime-local"></div>
      <div><label for="fEnd">Fin</label><input id="fEnd" type="datetime-local"></div>
    </div>
    <div style="display:flex;gap:18px;align-items:center;margin-bottom:12px">
      <label style="display:flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px;margin:0">
        <input id="fNoEnd" type="checkbox" style="width:auto"> sans limite (CPU)
      </label>
      <label style="display:flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px;margin:0">
        <input id="fOverload" type="checkbox" style="width:auto"> confirmer une charge PSU &gt; 80 %
      </label>
    </div>
    <div class="row" style="grid-template-columns:1fr 2fr">
      <div><label for="fMode">Mode d'exécution (§4.6)</label><select id="fMode"></select></div>
      <div><label for="fModeNote">&nbsp;</label><span class="muted" id="fModeNote" style="font-size:12px"></span></div>
    </div>
    <label>Devices engagés</label>
    <div class="machines" id="fDevices"></div>
    <div style="margin-top:14px"><button class="btn" id="createBtn">Créer la campagne</button>
      <span class="muted" id="simNote" style="font-size:12px;margin-left:10px"></span></div>
  </section>

  <section class="card">
    <h2>Campagnes</h2>
    <div id="tableWrap"><table><thead><tr>
      <th>#</th><th>Coin</th><th>Statut</th><th>Profil</th><th>Devices</th>
      <th>Début</th><th>Fin</th><th>Hashrate</th><th>Coût</th><th>Actions</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
    <div class="empty" id="emptyMsg" style="display:none">Aucune campagne.</div>
    <div class="journal" id="journal"></div>
  </section>
  <div class="foot" id="stamp"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var $ = function (sel) { return document.querySelector(sel); };
  var state = { campaigns: [], options: null, openId: null, simulation: false };

  function toast(text) {
    var el = $("#toast");
    el.textContent = text;
    el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.display = "none"; }, 6000);
  }

  function fmtDate(value) {
    if (!value) { return "—"; }
    var d = new Date(value);
    if (isNaN(d.getTime())) { return value; }
    return d.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
  }

  function fmtHs(value) {
    if (value === null || value === undefined) { return "—"; }
    var units = ["H/s", "kH/s", "MH/s", "GH/s", "TH/s", "PH/s"];
    var i = 0, v = Number(value);
    while (v >= 1000 && i < units.length - 1) { v /= 1000; i += 1; }
    return v.toFixed(i === 0 ? 0 : 2) + " " + units[i];
  }

  function fmtEur(value) {
    if (value === null || value === undefined) { return "—"; }
    return Number(value).toFixed(2) + " €";
  }

  function devicesText(c) {
    return c.devices.map(function (d) { return d.machine_name + " · " + d.label; }).join("<br>");
  }

  function actionButtons(c) {
    var out = [];
    if (c.status === "proposed") {
      out.push('<button class="btn sm" data-act="approve" data-id="' + c.id + '">Approuver</button>');
      out.push('<button class="btn sm danger" data-act="cancel" data-id="' + c.id + '">Annuler</button>');
    } else if (c.status === "approved") {
      out.push('<button class="btn sm" data-act="start" data-id="' + c.id + '">Démarrer maintenant</button>');
      out.push('<button class="btn sm danger" data-act="cancel" data-id="' + c.id + '">Annuler</button>');
    } else if (c.status === "running") {
      out.push('<button class="btn sm danger" data-act="stop" data-id="' + c.id + '">Arrêter</button>');
    }
    out.push('<button class="btn sm ghost" data-act="journal" data-id="' + c.id + '">Journal</button>');
    return '<div class="acts">' + out.join("") + "</div>";
  }

  function render() {
    var rows = state.campaigns.map(function (c) {
      return '<tr data-campaign-id="' + c.id + '">' +
        "<td>" + c.id + "</td>" +
        '<td class="mono">' + c.coin + "</td>" +
        '<td><span class="chip ' + c.status + '">' + c.status_label + "</span>" +
          (c.verified === true ? ' <span class="sim">retour vérifié</span>' : "") + "</td>" +
        "<td>" + (c.profile_name || "—") +
          '<div class="muted" style="font-size:10.5px">mode ' + (c.execution_mode || "host") +
          (c.vm ? " · VM " + c.vm.name + " (" + (c.vm.ip || "sans IP") + ")" : "") + "</div></td>" +
        '<td class="muted">' + devicesText(c) + "</td>" +
        "<td>" + fmtDate(c.start_at) + "</td>" +
        "<td>" + (c.end_at ? fmtDate(c.end_at) : "sans limite") + "</td>" +
        '<td class="mono">' + fmtHs(c.hashrate_hs) + "</td>" +
        '<td class="mono">' + fmtEur(c.cost_eur !== null ? c.cost_eur : c.cost_running_eur) + "</td>" +
        "<td>" + actionButtons(c) + "</td></tr>";
    }).join("");
    $("#rows").innerHTML = rows;
    $("#tableWrap").style.display = state.campaigns.length ? "" : "none";
    $("#emptyMsg").style.display = state.campaigns.length ? "none" : "";
    $("#simNote").textContent = state.simulation
      ? "Simulation active : les commandes sont journalisées, rien n'est exécuté."
      : "";
    $("#stamp").textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
    if (state.openId) { loadJournal(state.openId); }
  }

  function renderOptions() {
    var options = state.options;
    if (!options) { return; }
    var select = $("#fProfile");
    select.innerHTML = options.profiles.map(function (p) {
      return '<option value="' + p.id + '" data-coin="' + p.coin + '" data-mode="' + (p.execution_mode || "host") + '">' + p.name + " — " + p.coin + "</option>";
    }).join("");
    if (options.profiles.length) { $("#fCoin").value = options.profiles[0].coin; }
    var modeSelect = $("#fMode");
    var modes = options.modes || [{ value: "host", label: "Hôte" }];
    modeSelect.innerHTML = modes.map(function (m) {
      return '<option value="' + m.value + '">' + m.label + "</option>";
    }).join("");
    var first = options.profiles && options.profiles.length ? options.profiles[0] : null;
    modeSelect.value = (first && first.execution_mode) || options.default_mode || "host";
    var note = $("#fModeNote");
    if (modes.length > 1) {
      note.textContent = options.vm_ready
        ? "vm / hybrid : VM jetable créée depuis le modèle de la Configuration."
        : "vm / hybrid exigent un modèle de VM (Configuration → Spec mining) : sans lui, la campagne échouera au démarrage.";
    }
    // Les hôtes sans device détecté passent **après** : le premier cochable
    // reste un vrai device (mode hôte), l'hôte de spec n'est proposé qu'en vm.
    var blocks = [];
    var extra = [];
    options.machines.forEach(function (m) {
      var rows = m.devices.map(function (d) {
        var disabled = (!d.enabled || d.occupied_external) ? " disabled" : "";
        var cls = d.enabled && !d.occupied_external ? "dev" : "dev off";
        return '<label class="' + cls + '"><input type="checkbox" data-machine="' + m.id +
          '" value="' + d.uuid + '"' + disabled + "> " + d.label +
          (d.disabled_reason ? ' <span class="why">(' + d.disabled_reason + ")</span>" : "") + "</label>";
      }).join("");
      if (!rows) {
        extra.push('<div class="machine"><div class="name">' + m.name +
          '</div><label class="dev"><input type="checkbox" data-machine="' + m.id +
          '" value=""> hôte de spec (vCPU du modèle, mode vm)</label></div>');
        return;
      }
      blocks.push('<div class="machine"><div class="name">' + m.name + "</div>" + rows + "</div>");
    });
    $("#fDevices").innerHTML = blocks.concat(extra).join("");
  }

  function load() {
    return fetch("/api/campaigns", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        state.campaigns = data.campaigns || [];
        state.simulation = data.simulation === true;
        render();
      });
  }

  function loadOptions() {
    return fetch("/api/campaigns/options", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (data) { state.options = data; renderOptions(); });
  }

  function loadJournal(id) {
    state.openId = id;
    return fetch("/api/campaigns/" + id, { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var items = (data.events || []).map(function (e) {
          var detail = e.detail ? '<div class="detail">' + String(e.detail).replace(/</g, "&lt;") + "</div>" : "";
          return "<li><span class=\"ts\">" + fmtDate(e.ts) + "</span>" +
            '<span class="kind">' + e.kind + "</span> · " + e.actor +
            (e.simulated ? ' <span class="sim">simulé</span>' : "") +
            (e.result !== "ok" ? ' <span class="chip failed">' + e.result + "</span>" : "") +
            "<div>" + (e.message || "") + "</div>" + detail + "</li>";
        }).join("");
        var box = $("#journal");
        box.className = "journal open";
        box.innerHTML = "<h2>Journal — campagne #" + id + "</h2><ol>" + (items || "<li class='muted'>aucun événement</li>") + "</ol>";
      });
  }

  function create() {
    var picked = Array.prototype.slice.call(document.querySelectorAll("#fDevices input:checked"))
      .map(function (input) {
        return { machine_id: Number(input.getAttribute("data-machine")), device_uuid: input.value };
      });
    if (!picked.length) { toast("Cochez au moins un device"); return; }
    var startRaw = $("#fStart").value;
    var start = startRaw ? new Date(startRaw) : new Date();
    var noEnd = $("#fNoEnd").checked;
    var end = noEnd || !$("#fEnd").value ? null : new Date($("#fEnd").value);
    var body = {
      profile_id: Number($("#fProfile").value),
      coin: ($("#fCoin").value || "").toUpperCase(),
      devices: picked,
      start_at: start.toISOString(),
      end_at: end ? end.toISOString() : null,
      confirm_overload: $("#fOverload").checked,
      execution_mode: $("#fMode").value
    };
    fetch("/api/campaigns", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      if (!res.ok) { toast(res.data.detail || "Création refusée"); return; }
      toast("Campagne #" + res.data.id + " proposée");
      load();
    });
  }

  function act(verb, id) {
    var options = { method: "POST", credentials: "same-origin" };
    fetch("/api/campaigns/" + id + "/" + verb, options)
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) { toast(res.data.detail || "Action refusée"); return; }
        toast("Campagne #" + id + " : " + verb);
        load();
      });
  }

  $("#createBtn").addEventListener("click", create);
  $("#fNoEnd").addEventListener("change", function () {
    $("#fEnd").disabled = this.checked;
    if (this.checked) { $("#fEnd").value = ""; }
  });
  $("#fMode").addEventListener("change", function () {
    var vm = this.value === "vm" || this.value === "hybrid";
    $("#fModeNote").textContent = vm
      ? (state.options && state.options.vm_ready
          ? "VM jetable : créée, provisionnée, puis éteinte et conservée en fin de campagne."
          : "Modèle de VM absent : la campagne échouera au démarrage (Configuration → Spec mining).")
      : "Mineur directement sur la machine.";
  });
  $("#fProfile").addEventListener("change", function () {
    var option = this.options[this.selectedIndex];
    if (option && option.getAttribute("data-coin")) { $("#fCoin").value = option.getAttribute("data-coin"); }
    if (option && option.getAttribute("data-mode")) { $("#fMode").value = option.getAttribute("data-mode"); }
    if (state.options && state.options.default_mode) {
      $("#fModeNote").textContent = "mode du profil appliqué ; défaut du spec mining : " + state.options.default_mode;
    }
  });
  document.addEventListener("click", function (event) {
    var button = event.target.closest("button[data-act]");
    if (!button) { return; }
    var row = button.closest("tr[data-campaign-id]");
    var id = Number(
      (row && row.getAttribute("data-campaign-id")) || button.getAttribute("data-id")
    );
    var verb = button.getAttribute("data-act");
    if (verb === "journal") { loadJournal(id); return; }
    act(verb, id);
  });

  loadOptions().then(load);
  setInterval(load, 15000);
})();
</script>
</body>
</html>
