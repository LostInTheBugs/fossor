<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fossor — Tableau de bord</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#12161c;--card:#1a2029;--border:#2c3544;--txt:#e6edf3;--muted:#8b98a9;--accent:#4f8cff;--green:#3fb950;--red:#f85149;--yellow:#d29922}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
header h1{font-size:26px}
.nav-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.nav-tabs a{color:var(--muted);padding:8px 16px;font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer}
.nav-tabs a:hover{color:var(--txt)}
.nav-tabs a.active{background:var(--card);border-color:var(--border);color:var(--txt)}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
.chip.on{background:#1a3a2a;color:var(--green);border:1px solid var(--green)}
.chip.off{background:#3a1a1a;color:var(--red);border:1px solid var(--red)}
.chip.idle{background:#24292f;color:var(--muted);border:1px solid var(--border)}
.btn{background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.summary .box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;min-width:170px;flex:1}
.summary .k{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:3px}
.summary .v{font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.card.offline{border-color:#5a2a2a}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-head .name{font-size:16px;font-weight:700}
.card-head .sub{color:var(--muted);font-size:12px;margin-top:2px}
.card-head .host{color:var(--muted);font-size:11px;margin-top:2px}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.totals .k{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.totals .v{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:transparent;text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:5px 6px;border-bottom:1px solid var(--border)}
td{padding:5px 6px;border-bottom:1px solid #232b37}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.dev-name{display:flex;flex-direction:column}
.dev-name .mono{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--muted)}
.err{margin-top:10px;padding:8px 10px;border:1px solid #5a2a2a;border-radius:8px;background:#241618;color:#f0a1a1;font-size:11.5px;word-break:break-word}
.empty{color:var(--muted);font-size:13px;padding:26px;text-align:center;border:1px dashed var(--border);border-radius:12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;z-index:200;display:none}
.foot{color:var(--muted);font-size:11px;margin-top:16px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>⛏️ Fossor</h1><span style="color:var(--muted);font-size:13px">Tableau de bord</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="userBadge" class="chip on">admin</span>
      <button class="btn sm outline" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <nav class="nav-tabs">
    <a href="/dashboard" class="active">📊 Tableau de bord</a>
    <a href="/machines">🖥️ Machines</a>
    <a href="/settings">⚙️ Configuration</a>
    <a href="/audit">📋 Audit Log</a>
  </nav>

  <div class="summary">
    <div class="box"><span class="k">Machines en ligne</span><span class="v" id="sOnline">—</span></div>
    <div class="box"><span class="k">Hashrate total</span><span class="v" id="sHash">—</span></div>
    <div class="box"><span class="k">Consommation</span><span class="v" id="sPower">—</span></div>
    <div class="box"><span class="k">Dernière collecte</span><span class="v" id="sAge">—</span></div>
  </div>

  <div class="grid" id="cards"></div>
  <div class="empty" id="emptyMsg" style="display:none">Aucune machine configurée. Ajoutez une machine dans l'onglet Machines.</div>
  <div class="foot" id="stamp"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

const UNITS = [["PH/s", 1e15], ["TH/s", 1e12], ["GH/s", 1e9], ["MH/s", 1e6], ["kH/s", 1e3], ["H/s", 1]];
function fmtHs(hs) {
  if (hs === null || hs === undefined || isNaN(hs)) return "—";
  const v = Number(hs);
  for (const [label, factor] of UNITS) {
    if (Math.abs(v) >= factor || factor === 1) {
      const scaled = v / factor;
      const dec = Math.abs(scaled) >= 100 ? 0 : 1;
      return scaled.toFixed(dec) + " " + label;
    }
  }
  return "—";
}
function fmtW(w) {
  if (w === null || w === undefined || isNaN(w)) return "—";
  return Math.round(Number(w)) + " W";
}
function fmtTemp(t) {
  if (t === null || t === undefined || isNaN(t)) return "—";
  return Math.round(Number(t)) + " °C";
}
function fmtPct(p) {
  if (p === null || p === undefined || isNaN(p)) return "—";
  return Math.round(Number(p)) + " %";
}
function fmtUptime(s) {
  if (s === null || s === undefined) return "—";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + " j " + h + " h";
  if (h > 0) return h + " h " + m + " min";
  return m + " min";
}
function fmtAge(s) {
  if (s === null || s === undefined) return "jamais";
  if (s < 90) return "il y a " + s + " s";
  if (s < 3600) return "il y a " + Math.round(s / 60) + " min";
  return "il y a " + Math.round(s / 3600) + " h";
}

function statusChip(m) {
  if (!m.collected) return '<span class="chip idle">non collectée</span>';
  if (m.online) return '<span class="chip on">en ligne</span>';
  return '<span class="chip off">hors ligne</span>';
}

function deviceRows(devices) {
  if (!devices.length) return '<tr><td colspan="6" style="color:var(--muted)">Aucun device détecté</td></tr>';
  return devices.map((d) => {
    const label = d.kind === "cpu" ? "CPU" : "GPU" + (d.index === null || d.index === undefined ? "" : " " + d.index);
    const model = d.model || (d.kind === "cpu" ? "Processeur" : "GPU");
    const bus = d.pci_bus ? ' <span class="mono">' + esc(d.pci_bus) + "</span>" : "";
    return "<tr>" +
      '<td><div class="dev-name"><span>' + esc(label) + " · " + esc(model) + bus + "</span></div></td>" +
      '<td class="num">' + fmtHs(d.hashrate_hs) + "</td>" +
      '<td class="num">' + fmtTemp(d.temp_c) + "</td>" +
      '<td class="num">' + fmtPct(d.fan_pct) + "</td>" +
      '<td class="num">' + fmtW(d.power_w) + "</td>" +
      '<td class="num">' + fmtPct(d.load_pct) + "</td>" +
      "</tr>";
  }).join("");
}

function card(m) {
  const meta = [m.miner || "aucun mineur", m.coin || "", m.algo || ""].filter(Boolean).join(" · ");
  const api = m.api_port ? " · API " + m.api_port : "";
  return '<div class="card' + (m.collected && !m.online ? " offline" : "") + '">' +
    '<div class="card-head">' +
      "<div><div class=\"name\">" + esc(m.name) + "</div>" +
      '<div class="sub">' + esc(meta) + esc(api) + "</div>" +
      '<div class="host">' + esc(m.host) + " · " + esc(m.os_kind) + "</div></div>" +
      statusChip(m) +
    "</div>" +
    '<div class="totals">' +
      '<div><span class="k">Hashrate</span><span class="v">' + fmtHs(m.total_hashrate_hs) + "</span></div>" +
      '<div><span class="k">Conso</span><span class="v">' + fmtW(m.total_power_w) + "</span></div>" +
      '<div><span class="k">Uptime</span><span class="v">' + fmtUptime(m.uptime_s) + "</span></div>" +
      '<div><span class="k">Collecte</span><span class="v">' + fmtAge(m.age_s) + "</span></div>" +
    "</div>" +
    '<table><thead><tr><th>Device</th><th style="text-align:right">Hashrate</th><th style="text-align:right">Temp</th>' +
    '<th style="text-align:right">Ventilo</th><th style="text-align:right">Conso</th><th style="text-align:right">Charge</th></tr></thead>' +
    "<tbody>" + deviceRows(m.devices || []) + "</tbody></table>" +
    (m.error ? '<div class="err">' + esc(m.error) + "</div>" : "") +
    "</div>";
}

function render(machines) {
  $("#cards").innerHTML = machines.map(card).join("");
  $("#emptyMsg").style.display = machines.length ? "none" : "block";

  const online = machines.filter((m) => m.online).length;
  $("#sOnline").textContent = online + " / " + machines.length;

  const hs = machines.reduce((acc, m) => acc + (m.total_hashrate_hs || 0), 0);
  $("#sHash").textContent = fmtHs(hs || null);

  const watts = machines.reduce((acc, m) => acc + (m.total_power_w || 0), 0);
  $("#sPower").textContent = fmtW(watts || null);

  const ages = machines.map((m) => m.age_s).filter((a) => a !== null && a !== undefined);
  $("#sAge").textContent = ages.length ? fmtAge(Math.min(...ages)) : "jamais";

  $("#stamp").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR");
}

async function load() {
  try {
    const res = await fetch("/api/metrics/live", { headers: { "Accept": "application/json" } });
    if (res.status === 401) { window.location.href = "/"; return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (err) {
    $("#stamp").textContent = "Collecte indisponible : " + err.message;
  }
}

$("#logoutBtn").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/";
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
